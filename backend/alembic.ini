# Alembic configuration file
# All database URL settings are read at runtime from app.core.config.settings
# so this file does NOT contain a hardcoded sqlalchemy.url value.

[alembic]
# Placeholder — env.py reads DATABASE_URL from pydantic settings
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
